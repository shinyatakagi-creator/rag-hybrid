[project]
name = "rag-hybrid"
version = "0.1.0"
description = "Project 08: RAG with hybrid (BM25 + kNN, RRF) search on Elasticsearch over Kubernetes docs"
requires-python = ">=3.11"
dependencies = [
    "elasticsearch==9.5.1",
    "openai==3.37.0",
    "anthropic==2.1.0",
    "fastapi==0.161.1",
    "uvicorn==0.54.0",
    "python-dotenv==1.2.4",
    "beautifulsoup4==4.15.0",
    "tiktoken==0.14.0",
    "langchain-text-splitters==1.1.3",
    "pytest==9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
